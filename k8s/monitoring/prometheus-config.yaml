apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kotlin-playground
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kotlin-playground'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 5s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - kotlin-playground
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: kotlin-playground
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
