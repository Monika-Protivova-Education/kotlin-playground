apiVersion: apps/v1
kind: Deployment
metadata:
  name: kotlin-playground
  namespace: kotlin-playground
  labels:
    app: kotlin-playground
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kotlin-playground
  template:
    metadata:
      labels:
        app: kotlin-playground
    spec:
      containers:
        - name: app
          image: kotlin-playground:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
